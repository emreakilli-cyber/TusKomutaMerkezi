<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060A">
<title>Rota · TUS 23 Ağustos</title>
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root{
  --void:#04050A;
  --cam:rgba(255,255,255,.045); --cam2:rgba(255,255,255,.075); --camK:rgba(255,255,255,.085);
  --ink:#EDEFF2; --ink2:#A6ADB8; --ink3:#6E7684; --ink4:#4A515D;
  --doom:#6FA35A; --doomL:#93C47B;
  --bilgi:#7BA7D9; --bilgiD:#3A5878;
  --steel:#CBD2D9;
  --up:#6FA35A; --down:#B5544C; --even:#8A9099;
  --pembe:#D98BA0; --turuncu:#D2955F; --sari:#C9B96C; --mavi:#7C9CBE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#04050A;color-scheme:dark}
html,body{height:100%;margin:0;overflow:hidden}
body{color:var(--ink);
  background:radial-gradient(155% 105% at 50% -14%,#0B1020 0%,#06080F 42%,#04050A 100%);
  font:400 15px/1.5 ui-sans-serif,-apple-system,"SF Pro Text",system-ui,sans-serif;
  letter-spacing:-.006em;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.m{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-variant-numeric:tabular-nums}
.cap{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink4);font-weight:500}
#gok{position:fixed;inset:0;z-index:0;pointer-events:none}
#toz{position:fixed;inset:0;z-index:60;pointer-events:none}

/* cam yüzey */
.cam{background:var(--cam);border:.5px solid var(--camK);border-radius:16px;
  backdrop-filter:blur(22px) saturate(135%);-webkit-backdrop-filter:blur(22px) saturate(135%)}

header{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;
  padding:16px 26px 12px;position:relative;z-index:5;background:none;border:0}
.sayac{display:flex;align-items:baseline;gap:10px}
.sayac .n{font-size:33px;line-height:1;font-weight:200;letter-spacing:-.035em}
.sayac .l{font-size:11px;line-height:1.3;color:var(--ink3)}
.sayac .l b{display:block;color:var(--ink2);font-weight:500}
.okumalar{display:flex;gap:26px}
.ok{text-align:right}
.ok .v{font-size:23px;line-height:1;font-weight:300;letter-spacing:-.025em;margin:4px 0 3px}
.ok.hyl .v{color:var(--doomL)}
.ok .s{font-size:10.5px;color:var(--ink3)}
.ok .s em{font-style:normal;color:var(--doomL)}

main{flex:1 1 auto;position:relative;overflow:hidden;z-index:5}
.vw{position:absolute;inset:0;opacity:0;pointer-events:none}
.vw.on{opacity:1;pointer-events:auto}

/* ── ROTA ── */
#rota{display:grid;grid-template-columns:minmax(310px,38%) 1fr;height:100%}
#cark{position:relative;overflow:hidden}
#ray{position:absolute;inset:0;pointer-events:none;z-index:0}
.sahne{position:absolute;left:0;right:0;top:50%;z-index:1}
.sr-item{position:absolute;left:14px;right:14px;top:0;transform-origin:50% 50%;
  transition:transform .52s cubic-bezier(.24,.74,.22,1),opacity .40s ease}
.serit{display:flex;align-items:center;gap:10px;height:42px;padding:0 14px;border-radius:11px;
  background:rgba(255,255,255,.034);border:.5px solid rgba(255,255,255,.065);
  backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);
  -webkit-mask-image:linear-gradient(90deg,#000 0,#000 50%,rgba(0,0,0,.30) 86%,rgba(0,0,0,0) 100%);
  mask-image:linear-gradient(90deg,#000 0,#000 50%,rgba(0,0,0,.30) 86%,rgba(0,0,0,0) 100%);
  transition:background .28s}
.sr-item:not(.act) .serit:hover{background:var(--cam2)}
.serit .pt{width:5px;height:5px;border-radius:50%;flex:0 0 auto}
.serit .sa{font-size:12.5px;color:var(--ink2);min-width:42px;font-weight:500}
.serit .br{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.serit .ko{font-size:12.5px;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.sr-item.done .serit .ko,.sr-item.done .serit .br{text-decoration:line-through;text-decoration-color:var(--ink4);opacity:.6}
.serit .tik{color:var(--doomL);font-size:12px}

.kart{border-radius:18px;background:var(--cam2);border:.5px solid rgba(255,255,255,.12);
  backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);
  box-shadow:0 24px 60px -26px #000;padding:15px 18px 13px}
.kUst{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.kSaat{font-size:24px;line-height:1;font-weight:600;letter-spacing:-.035em}
.kBlok{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);
  border:.5px solid var(--camK);border-radius:6px;padding:4px 8px;transition:color .3s,border-color .3s}
.kBlok.simdi{color:var(--doomL);border-color:rgba(147,196,123,.5);background:rgba(111,163,90,.10);font-weight:600}
.kBrans{display:flex;align-items:center;gap:8px;margin:0 0 6px;padding-top:12px;
  border-top:.5px solid rgba(255,255,255,.07)}
.kBrans .pt{width:6px;height:6px;border-radius:50%}
.kBrans span{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);font-weight:500}
.kKonu{font-size:19px;line-height:1.25;font-weight:400;letter-spacing:-.02em;margin-bottom:8px}
.kKaynak{font-size:12.5px;color:var(--doomL)}
.kBtn{display:flex;gap:8px;margin-top:15px}
.bt{padding:8px 14px;border-radius:10px;font-size:12.5px;border:.5px solid var(--camK);
  background:var(--cam);color:var(--ink2);backdrop-filter:blur(10px);
  transition:background .18s,color .18s}
.bt:hover{background:var(--cam2);color:var(--ink)}
.bt.pri{background:rgba(235,240,245,.92);border-color:transparent;color:#0A0C10;font-weight:600}
.bt.gh{margin-left:auto;color:var(--ink4)}

#uzay{position:relative;overflow:hidden}
#brifing{position:absolute;inset:0;padding:32px 46px;overflow-y:auto;
  display:flex;flex-direction:column;justify-content:center;opacity:0;transition:opacity .26s ease}
#brifing.gor{opacity:1}
.bfEtiket{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  border:.5px solid var(--camK);border-radius:20px;padding:5px 12px;margin-bottom:18px;background:var(--cam)}
.bfEtiket i{width:6px;height:6px;border-radius:50%}
.bfEtiket span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
#bfBas{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--doomL);margin-bottom:11px;font-weight:600}
#bfMetin{font-size:17px;line-height:1.62;color:var(--ink);max-width:56ch;font-weight:300}
.bfKunye{display:flex;gap:34px;margin-top:24px;padding-top:18px;
  border-top:.5px solid rgba(255,255,255,.07);flex-wrap:wrap}
.bfKunye>div{display:flex;flex-direction:column;gap:5px}
.bfKunye .d{font-size:17px;color:var(--ink)}
.bfKunye .d.g{color:var(--doomL)}
.bfBag{margin-top:16px;padding:13px 15px;border-radius:13px;background:var(--cam);border:.5px solid var(--camK)}
.bfBag .h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink4);margin-bottom:6px}
.bfBag p{margin:0 0 5px;font-size:13px;line-height:1.5;color:var(--ink2);font-weight:300}
.bfBag p b{color:var(--doomL);font-weight:400}
.bfBag p:last-child{margin-bottom:0}

.kd{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px 26px 96px}
h2.bb{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink4);margin:0 0 13px;font-weight:600}
h2.bb+.alt{margin:-9px 0 16px;font-size:13px;color:var(--ink3);font-weight:300;max-width:78ch;line-height:1.55}

#rotaHarita{width:100%;height:auto;display:block;margin-bottom:14px}
.ist{display:flex;gap:38px;margin-bottom:30px;flex-wrap:wrap}
.ist>div{display:flex;flex-direction:column;gap:5px}
.ist .d{font-size:21px;font-weight:200;letter-spacing:-.02em}
.ist .d small{font-size:12px;color:var(--ink4);font-weight:400}

#takvimSar{position:relative;padding-top:14px}
#kordon{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
#kordon path.hal{pointer-events:stroke;cursor:pointer}
.ay{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;position:relative;z-index:1}
.ayb{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4);text-align:center;padding-bottom:4px}
.gn{border-radius:13px;background:var(--cam);border:.5px solid var(--camK);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  padding:8px 10px 10px;min-height:130px;position:relative}
.gn.bos{border-color:transparent;background:none;backdrop-filter:none}
.gn.now{border-color:rgba(147,196,123,.55);background:rgba(111,163,90,.09)}
.gn.past{opacity:.44}
.gn.tat{background:rgba(139,123,181,.07);border-color:rgba(139,123,181,.22)}
.gn.snv{background:rgba(111,163,90,.11);border-color:rgba(111,163,90,.42)}
.gn .n{font-size:12.5px;color:var(--ink3);margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.gn.now .n{color:var(--doomL)}
.gn .n em{font-style:normal;font-size:8.5px;letter-spacing:.11em;color:var(--doomL)}
.gn .iw{font-size:9.5px;line-height:1.3;margin-bottom:5px;display:flex;gap:5px}
.gn .iw i{width:4px;height:4px;border-radius:50%;margin-top:4px;flex:0 0 auto}
.gn .iw u{text-decoration:none;color:var(--ink2);display:block}
.gn .iw s{text-decoration:none;color:var(--ink4);display:block;font-size:9px}
.gn .iw.bagli u{color:var(--doomL)}
.gn .iw.done u,.gn .iw.done s{text-decoration:line-through;text-decoration-color:var(--ink4);opacity:.5}
.nfo{position:absolute;width:20px;height:20px;border-radius:50%;
  border:.5px solid rgba(123,167,217,.55);background:rgba(123,167,217,.13);color:var(--bilgi);
  font-size:11px;font-weight:600;display:grid;place-items:center;z-index:4;cursor:pointer;
  backdrop-filter:blur(8px);transition:background .2s,transform .2s}
.nfo:hover{background:rgba(123,167,217,.3);color:#fff;transform:scale(1.15)}

#perde{position:fixed;inset:0;background:rgba(2,3,6,.72);backdrop-filter:blur(10px);z-index:80;
  display:none;align-items:center;justify-content:center;padding:26px}
#perde.ac{display:flex}
.mdl{max-width:580px;width:100%;border-radius:20px;border:.5px solid rgba(255,255,255,.13);
  background:rgba(255,255,255,.07);backdrop-filter:blur(30px) saturate(140%);
  padding:26px 28px 22px;box-shadow:0 34px 80px -24px #000}
.mdl h3{margin:0 0 6px;font-size:20px;font-weight:500;letter-spacing:-.02em}
.mdl .tr{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--bilgi);margin-bottom:13px;font-weight:600}
.mdl p{margin:0;font-size:15.5px;line-height:1.64;color:var(--ink2);font-weight:300}
.mdl button{margin-top:20px}

.rdSar{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(210px,.95fr);gap:20px;
  align-items:center;margin-bottom:30px}
#radar{width:100%;height:auto;display:block;max-height:min(50vh,420px)}
.lgn{display:flex;flex-direction:column;gap:12px}
.lgn>div{display:flex;gap:10px;align-items:flex-start}
.lgn .sw{width:22px;height:0;margin-top:8px;flex:0 0 auto}
.lgn .tx{font-size:12.5px;color:var(--ink3);line-height:1.45;font-weight:300}
.lgn .tx b{display:block;color:var(--ink);font-weight:500;font-size:13px;margin-bottom:2px}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:30px}
.mini{border-radius:13px;background:var(--cam);border:.5px solid var(--camK);padding:11px 12px 7px;
  backdrop-filter:blur(12px)}
.miniB{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:3px;gap:8px}
.miniB .a{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:600}
.miniB .g{font-size:11px}
.mini .sub{font-size:9.5px;color:var(--ink4);margin-bottom:5px}
.mini svg{width:100%;height:auto;display:block}

.frm,.bnGrid,.vk{border-radius:15px;background:var(--cam);border:.5px solid var(--camK);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.frm{display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;padding:15px 17px}
.al{display:flex;flex-direction:column;gap:6px}
.al input{font-family:ui-monospace,monospace;font-size:14px;color:var(--ink);
  background:rgba(0,0,0,.30);border:.5px solid var(--camK);border-radius:9px;padding:9px 11px;width:104px}
.al input:focus{outline:none;border-color:var(--doomL)}
.al input.w{width:158px}
.bnGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px;padding:15px 17px;margin-bottom:26px}
.bnGrid .al input{width:100%}
.bnTop{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.bnTop .hesap{font-size:12px;color:var(--doomL)}
table.ct{width:100%;border-collapse:collapse;font-family:ui-monospace,monospace;font-size:12.5px;margin-bottom:26px}
table.ct th{font-family:inherit;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink4);
  text-align:right;padding:0 12px 9px;font-weight:600;border-bottom:.5px solid var(--camK)}
table.ct th:nth-child(-n+2),table.ct td:nth-child(-n+2){text-align:left}
table.ct td{padding:9px 12px;text-align:right;border-bottom:.5px solid rgba(255,255,255,.045);color:var(--ink2)}
table.ct td.g{color:var(--doomL)}
.vk{display:flex;gap:9px;flex-wrap:wrap;padding:15px 17px;align-items:center}
.vk p{margin:0;font-size:12px;color:var(--ink3);flex:1 1 250px;line-height:1.55;font-weight:300}
textarea.ak{width:100%;height:80px;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--ink3);
  background:rgba(0,0,0,.30);border:.5px solid var(--camK);border-radius:9px;padding:10px;margin-top:9px;resize:vertical}

nav{flex:0 0 auto;display:flex;justify-content:center;gap:34px;padding:8px 0 16px;
  background:none;border:0;position:relative;z-index:5}
.orb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:none;border:0;transition:transform .22s}
.orb::before{content:'';position:absolute;inset:0;border-radius:50%;
  background:rgba(255,255,255,.06);border:.5px solid rgba(255,255,255,.11);
  backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);
  opacity:0;transform:scale(.82);transition:opacity .26s,transform .26s}
.orb.on::before{opacity:1;transform:scale(1)}
.orb:hover{transform:translateY(-1.5px)}
.orb svg{width:19px;height:19px;stroke:var(--ink4);fill:none;stroke-width:1.5;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .26s;position:relative;z-index:1}
.orb.on svg{stroke:var(--ink)}
.orb .e{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-size:8.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink4);white-space:nowrap;transition:color .26s}
.orb.on .e{color:var(--ink2)}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:3px}
::-webkit-scrollbar-track{background:transparent}

/* ——— dar pencere / bölünmüş sekme ——— */
@media (max-width:1000px){
  #rota{grid-template-columns:minmax(280px,44%) 1fr}
  #brifing{padding:24px 28px}#bfMetin{font-size:15.5px}
  .rdSar{grid-template-columns:1fr}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kd{padding:18px 18px 92px}
}
@media (max-width:820px){
  #rota{grid-template-columns:1fr;grid-template-rows:minmax(0,1.05fr) minmax(0,.95fr)}
  #uzay{border-top:.5px solid rgba(255,255,255,.055)}
  #brifing{position:relative;inset:auto;height:100%;padding:18px 20px;justify-content:flex-start}
  #bfMetin{font-size:14.5px;max-width:none}
  .bfKunye{gap:20px;margin-top:16px;padding-top:14px}
  .bfKunye .d{font-size:15px}
  .sayac .n{font-size:26px}.ok .v{font-size:19px}.okumalar{gap:16px}
  header{padding:11px 16px 7px}
  .kd{padding:15px 14px 90px}
  #kordon{display:none}
  .ay{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
  .ayb{display:none}
  .gn{min-height:auto}
  .gn.bos{display:none}
  .nfo{display:none}
  #rotaHarita{min-width:760px}
  .kdKaydir{overflow-x:auto}
}
@media (max-width:620px){
  header{padding:9px 13px 6px;gap:12px}
  .sayac .n{font-size:22px}.sayac .l{font-size:10px}
  .ok .v{font-size:16.5px}.ok .s{font-size:9.5px}.okumalar{gap:12px}
  .cap{font-size:9px}
  #rota{grid-template-rows:minmax(0,1fr) minmax(0,.85fr)}
  .serit{height:38px;padding:0 12px;gap:8px}
  .serit .sa{font-size:11.5px;min-width:38px}.serit .br{font-size:11.5px}.serit .ko{display:none}
  .kart{padding:13px 15px 11px;border-radius:16px}
  .kSaat{font-size:21px}.kKonu{font-size:17px}.kKaynak{font-size:11.5px}
  .kBlok{display:none}
  .bt{padding:8px 12px;font-size:12px}
  #brifing{padding:15px 16px}
  #bfMetin{font-size:13.5px;line-height:1.55}
  .bfKunye{gap:16px}.bfKunye .d{font-size:14px}
  .bfBag p{font-size:12px}
  .grid3{grid-template-columns:1fr}
  .ay{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ist{gap:22px}.ist .d{font-size:18px}
  .kd{padding:13px 12px 88px}
  nav{gap:26px;padding:6px 0 12px}
  .orb{width:38px;height:38px}.orb svg{width:17px;height:17px}
}
@media (max-height:560px){
  header{padding:7px 16px 5px}
  .sayac .n{font-size:22px}
  #rota{grid-template-rows:minmax(0,1fr) minmax(0,.8fr)}
  nav{padding:4px 0 9px}
  .orb .e{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>
<canvas id="gok"></canvas>

<header>
  <div class="sayac"><span class="n m" id="kalan">–</span>
    <span class="l">gün kaldı<b id="star">23 Ağustos</b></span></div>
  <div class="okumalar">
    <div class="ok"><div class="cap">Ölçülen</div><div class="v m" id="oP">–</div><div class="s m" id="oN">–</div></div>
    <div class="ok hyl"><div class="cap">Parakete</div><div class="v m" id="hP">–</div><div class="s m" id="hN">–</div></div>
  </div>
</header>

<main>
  <section class="vw on" id="rota">
    <div id="cark" class="dis"><svg id="ray"></svg><div class="sahne" id="sahne"></div></div>
    <div id="uzay" class="dis"><div id="brifing"></div></div>
  </section>
  <section class="vw" id="seyir"><div class="kd" id="seyirIc"></div></section>
  <section class="vw" id="olcum"><div class="kd" id="olcumIc"></div></section>
</main>

<nav>

vda 7-8-8-8-6, tek fire yok. Programın en yoğun getiri noktası, 4.2 sayfa/soru. Erken öğrenilirse sınava kadar dört kez tekrar edilebiliyor; geç öğrenilirse bir kez. Aynı gün Genel Cerrahi'ye başlamamızın nedeni de bu: Speetus 121 sayfada 20.4 soru veriyor (5.9 sayfa/soru) ve bu yüzden 15.6 saatlik videosunu iptal ettik — kitap videodan ucuz."], ["2026-07-30", "Neden patoloji sadece 'bakım'?", "Patolojide %65.3'tesin — en iyi branşın ve ölçülmüş tavanın. Yeni öğrenmenin marjinal getirisi neredeyse sıfır. Ama bakımsız bırakılırsa %50'ye düşer; 18.2 sorunun %15'i = 2.8 net = 0.58 puan kaybı. Bu yüzden 4 kısa seans, genişleyen aralıkla: 30 Tem · 6 Ağu · 14 Ağu · 21 Ağu. Aralıklar Cepeda ve ark. (2008) çizgisinde: optimal tekrar aralığı, hedef saklama süresinin %10-20'si."], ["2026-08-02", "Neden ilk deneme 7. günde?", "Model kalibrasyonu. Tüm tahsisler bir tahmine dayanıyor: 'yüksek getiri konularında %55-65 başarıya ulaşırsın.' Bu bir varsayım ve test edilmesi gerekiyor. Yedi gün, ölçülebilir bir değişim üretecek kadar uzun; rotayı düzeltebilecek kadar erken. Bu denemenin branş netlerini Ölçüm sekmesine girdiğinde güç matrisi hangi branşta beklentinin altında kaldığını gösterecek."], ["2026-08-05", "Neden kadın doğum videosunu izlemiyorsun?", "Video + kitap 26.1 saat sürüp 0.039 puan/saat getiriyordu — listenin en düşüğü. Sadece Fast Track kitabı 10.8 saatte 0.066 puan/saat veriyor. Video sana 15 fazla saate 0.31 puan kazandırıyordu; o 15 saati pediatriye verince 1.0 puan geliyor. Jinekolojik Onkoloji'yi de attık: 19 sayfada 0.8 soru, 23.8 sayfa/soru."], ["2026-08-08", "Neden dahiliye videosu bugün bitmek zorunda?", "Bu tarihi biz seçmedik. Atilla Uslu videolarına erişimin 9-10 Ağustos'ta kapanıyor. 24 sa 25 dk'lık içerik 1.5x'te 16.3 saate iniyor ve 13 güne yayıldı — akşamları 1.3 saat. Bugün ne kaldıysa bitmek zorunda; yarın bu kaynak yok. Programdaki tek dış kısıt bu."], ["2026-08-09", "Neden pediatri en sona ve en uzuna bırakıldı?", "25 soruyla en büyük branş, ama 22 konuya dağılmış ve en büyük konusu sadece 2.4 soru. Yoğunlaşma olmadığı için kısa yolu yok: 0.034 puan/saat ile listenin en pahalısı. Kıyasla Genel Cerrahi 23.6 soru veriyor ama tek konusu (Temel Cerrahi) 5.8 soru — 27 sayfada branşın dörtte biri. Ucuz branşları önce bitirip kalan bütçeyi pediatriye yığıyoruz."], ["2026-08-10", "Küçük stajlar neden programda?", "Tusanaliz verisi küçük stajların 22 soru getirdiğini gösterdi — Dahiliye (23.2) ile aynı ölçekte. Senin deneme takip Excel'inde bu branşın hiç satırı yok, yani buradaki performansın hiç ölçülmemişti. Üstelik TUSTIME küçük stajlar kitabın zaten dolu ve Acil Tıp bölümü 6 sayfada 1.8 soru veriyor: 3.3 sayfa/soru, tüm programın en ucuz bölümü."], ["2026-08-12", "Neden anatomi ikinci fazda ve neden TTS değil?", "İki karar var. Birincisi kaynak: Nöroanatomi TTS'te 83 sayfa, Fast Track'te 35 sayfa — aynı 4.2 soru, üç kat ucuz. Fast Track ile anatomi 3.3 saat/net ediyor, temel bilimler eşiği olan 5.67'nin çok altında. İkincisi zamanlama: anatomi saf ezber, anlamsal iskeleti zayıf. Erken öğrenilirse unutuluyor. Sınava 11 gün kala yerleştirmek ezberin sınav gününe taze ulaşmasını sağlıyor."], ["2026-08-18", "Neden son 5 gün sıfır yeni konu?", "Sınava 5 gün kala öğrenilen bilgi yeterince tekrar edilemediği için kalıcı olmuyor — öğrenme eğrisi değil, unutma eğrisi çalışıyor. Bu 5 gün, önceki 22 günde öğrendiklerinin sınav sabahına sağlam ulaşması için ayrıldı. Bütçenin 51.5 saati zaten baştan aralıklı tekrara ayrılmıştı; bu fazda oranı %100'e çıkıyor."], ["2026-08-22", "Neden 19:00'da bitiyor?", "Bellek konsolidasyonu uyku bağımlıdır (Rasch & Born, Physiological Reviews, 2013). Sınav gecesi uykudan çalınan saat, o güne kadar öğrendiklerine erişimini zayıflatır — net kazandırmaz, kaybettirir. 19:00'dan sonra yeni bilgi yok; belgeler, kalem, adres hazırlanır ve normal saatinde yatılır."]], SORU={"den": {"Anatomi": 13, "Histo-Embriyoloji": 7, "Fizyoloji": 8, "Biyokimya": 18, "Mikrobiyoloji": 18, "Patoloji": 18, "Farmak const Depo=(()=>{const A='rota-tus-v4';let bel=null,ok=true;
  try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){ok=false}
  const bos=()=>({bitti:{},denemeler:JSON.parse(JSON.stringify(TOHUM))});
  return{ok,oku(){if(!ok)return bel||(bel=bos());
    try{return JSON.parse(localStorage.getItem(A))||bos()}catch(e){return bos()}},
  yaz(v){if(!ok){bel=v;return}try{localStorage.setItem(A,JSON.stringify(v))}catch(e){bel=v}}}})();
let D=Depo.oku(); if(!D.denemeler||!D.denemeler.length)D.denemeler=JSON.parse(JSON.stringify(TOHUM));
const kay=()=>Depo.yaz(D);

const bgun=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const fark=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
const trT=i=>{const d=new Date(i+'T00:00');return d.getDate()+' '+AY[d.getMonth()].slice(0,3)};
const puan=(t,k)=>TABAN+KT*t+KK*k;
const id=g=>g.d+'|'+g.b, anah=g=>g.br+'|'+g.k;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sirali=()=>[...D.denemeler].sort((a,b)=>a.tar<b.tar?-1:1);
function son(){const s=sirali().pop();return s?{t:+s.t,k:+s.k,tar:s.tar,kay:s.kay,bn:s.bn||null}:{t:0,k:0,tar:'2000-01-01',bn:null}}
function para(){const o=son();let dt=0,dk=0;
  GOREVLER.forEach(g=>{const b=D.bitti[id(g)];if(!b||b<=o.tar)return;g.tur==='T'?dt+=g.kaz:dk+=g.kaz});
  return{t:o.t+dt,k:o.k+dk,o}}
function bransDurum(){const o=son(),r={};
  RB.forEach(b=>{let net=null;
    if(o.bn)net=b==='Fizyoloji'?(+(o.bn['Fizyoloji']||0))+(+(o.bn['Histo-Embriyoloji']||0)):(o.bn[b]!=null?+o.bn[b]:null);
    const payda=b==='Fizyoloji'?SORU.den['Fizyoloji']+SORU.den['Histo-Embriyoloji']:SORU.den[b];
    let olc=(net!=null&&payda)?net/payda:null;
    if(b==='Küçük Stajlar'&&olc==null&&o.k)olc=o.k/100;
    let kz=0;GOREVLER.forEach(g=>{const bt=D.bitti[id(g)];if(bt&&bt>o.tar&&g.br===b)kz+=g.kaz});
    r[b]={olc,bek:olc==null?null:Math.min(olc+kz/SORU.radar[b],1),artis:kz/SORU.radar[b],kz}});
  return r}
function ust(){const b=bgun();
  document.getElementById('kalan').textContent=Math.max(fark(b,SINAV),0);
  const sd=new Date(SINAV+'T00:00');
  document.getElementById('star').textContent=sd.getDate()+' '+AY[sd.getMonth()];
  const o=son(),p=para(),op=puan(o.t,o.k),hp=puan(p.t,p.k);
  document.getElementById('oP').textContent=op.toFixed(2);
  document.getElementById('oN').textContent=o.t.toFixed(2)+' T · '+o.k.toFixed(2)+' K';
  document.getElementById('hP').textContent=hp.toFixed(2);
  document.getElementById('hN').innerHTML=(hp-op>.004?'<em>+'+(hp-op).toFixed(2)+'</em> · ':'')+p.t.toFixed(1)+' T · '+p.k.toFixed(1)+' K'}

/* ══════════ KÜRESEL GÖKYÜZÜ ══════════ */
const Gok=(()=>{
  const cv=document.getElementById('gok'),ctx=cv.getContext('2d');
  let W=0,H=0,st=[],akan=[],son=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function boyut(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H;
    const n=Math.round(W*H/3100);st=[];
    for(let i=0;i<n;i++){const p=Math.random();st.push({x:Math.round(rnd(0,W)),y:Math.round(rnd(0,H)),
      r:p<.09?rnd(1.5,2.2):p<.34?rnd(1.0,1.5):1,
      a:p<.09?rnd(.42,.78):p<.34?rnd(.24,.46):rnd(.11,.26),
      fz:rnd(0,6.28),hz:rnd(.22,.62),pr:Math.random()<.13})}}
  function akanEkle(){akan.push({x:rnd(W*.1,W*.95),y:rnd(-30,H*.55),
    vx:-rnd(2.6,4.4),vy:rnd(1.1,2.0),om:0,uz:rnd(46,96)})}
  function ciz(t){
    ctx.clearRect(0,0,W,H);
    for(const s of st){
      let a=s.a+Math.sin(t*.0009*s.hz+s.fz)*(s.pr?.20:.06);
      if(s.pr){const p=Math.sin(t*.00042+s.fz);if(p>.986)a+=(p-.986)*13}
      if(a<=.010)continue;
      ctx.globalAlpha=Math.min(a,.92);ctx.fillStyle='#E4EBF6';
      ctx.fillRect(s.x,s.y,s.r,s.r)}
    if(t-son>rnd(4200,9500)){akanEkle();son=t}
    for(let i=akan.length-1;i>=0;i--){const k=akan[i];k.om+=.016;
      k.x+=k.vx;k.y+=k.vy;
      const a=Math.sin(Math.min(k.om,1)*Math.PI)*.62;
      if(a>.01){const n=Math.hypot(k.vx,k.vy);
        const g=ctx.createLinearGradient(k.x,k.y,k.x-k.vx/n*k.uz,k.y-k.vy/n*k.uz);
        g.addColorStop(0,'rgba(226,234,244,'+a.toFixed(3)+')');g.addColorStop(1,'rgba(226,234,244,0)');
        ctx.strokeStyle=g;ctx.lineWidth=1.1;ctx.beginPath();ctx.moveTo(k.x,k.y);
        ctx.lineTo(k.x-k.vx/n*k.uz,k.y-k.vy/n*k.uz);ctx.stroke()}
      if(k.om>1||k.x<-120||k.y>H+120)akan.splice(i,1)}
    ctx.globalAlpha=1}
  return{boyut,ciz}})();

/* ══════════ TOZ: füzyon + dağılma ══════════ */
const Toz=(()=>{
  const cv=document.getElementById('toz'),ctx=cv.getContext('2d');
  let W=0,H=0,P=[],hedefBit=null;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function boyut(){W=innerWidth;H=innerHeight;cv.width=W;cv.height=H}
  function ornek(bl,adim){
    const oc=document.createElement('canvas');oc.width=W;oc.height=H;
    const o=oc.getContext('2d');const pts=[];
    bl.forEach(b=>{o.clearRect(0,0,W,H);o.font=b.font;o.fillStyle='#fff';o.textBaseline='top';
      let sat='',yy=b.y;const out=[];
      b.metin.split(/\s+/).forEach(k=>{const t=sat?sat+' '+k:k;
        if(o.measureText(t).width>b.maxW&&sat){out.push(sat);sat=k}else sat=t});
      if(sat)out.push(sat);
      out.forEach(s=>{if(yy>-20&&yy<H)o.fillText(s,b.x,yy);yy+=b.lh});
      const d=o.getImageData(0,0,W,H).data;
      for(let y=1;y<H;y+=adim)for(let x=1;x<W;x+=adim)
        if(d[(y*W+x)*4+3]>110)pts.push({x,y,c:b.renk,s:b.s})});
    return pts}
  function fuzyon(bl,bitti){
    if(AZ){bitti&&bitti();return}
    const pts=ornek(bl,3);
    if(!pts.length){bitti&&bitti();return}
    const EN=1400;let hd=pts;
    if(pts.length>EN){hd=[];const a=pts.length/EN;for(let i=0;i<EN;i++)hd.push(pts[Math.floor(i*a)])}
    hd.sort((a,b)=>a.x-b.x||a.y-b.y);
    P=hd.map(h=>{const yon=Math.random()*6.28,uz=rnd(60,260);
      return{x:h.x+Math.cos(yon)*uz,y:h.y+Math.sin(yon)*uz,tx:h.x,ty:h.y,c:h.c,s:h.s,
             a:0,ha:.95,vx:0,vy:0,gec:Math.random()*70,mod:'top',t0:performance.now()}});
    hedefBit=bitti;}
  function dagil(kok){
    if(AZ)return;
    const yeni=[];
    kok.querySelectorAll('.dis').forEach(e=>{
      const r=e.getBoundingClientRect();
      if(r.width<3||r.height<3||r.bottom<0||r.top>H)return;
      const n=Math.min(260,Math.round(r.width*r.height/620));
      for(let i=0;i<n;i++){const x=rnd(r.left,r.right),y=rnd(Math.max(r.top,0),Math.min(r.bottom,H));
        yeni.push({x,y,tx:0,ty:0,c:'rgba(226,236,250,1)',s:rnd(1,2.1),a:rnd(.55,.95),ha:0,
          vx:rnd(1.1,4.2)+(x/W)*2.2, vy:rnd(-2.6,-.4),gec:(1-y/H)*55+Math.random()*70,mod:'dag',t0:performance.now(),sur:0})}});
    P=yeni;}
  function kur(kok){
    if(AZ)return;
    const yeni=[],now=performance.now();
    kok.querySelectorAll('.dis').forEach(e=>{
      const r=e.getBoundingClientRect();
      if(r.width<3||r.height<3||r.bottom<0||r.top>H)return;
      const n=Math.min(200,Math.round(r.width*r.height/900));
      for(let i=0;i<n;i++){const tx=rnd(r.left,r.right),ty=rnd(Math.max(r.top,0),Math.min(r.bottom,H));
        const yon=Math.random()*6.283,uz=rnd(80,290);
        yeni.push({x:tx+Math.cos(yon)*uz,y:ty+Math.sin(yon)*uz,tx,ty,c:'rgba(226,236,250,1)',
          s:rnd(.9,1.8),a:0,ha:.85,gec:Math.random()*150,mod:'top',t0:now,sur:330})}});
    P=P.concat(yeni);}
  function dongu(){
    ctx.clearRect(0,0,W,H);
    const now=performance.now();let canli=0;
    for(const p of P){const dt=now-p.t0-p.gec;if(dt<0){continue}
      if(p.mod==='top'){p.x+=(p.tx-p.x)*.20;p.y+=(p.ty-p.y)*.20;p.a+=(p.ha-p.a)*.22;
        if(dt>(p.sur||300)){p.ha=0;p.a+=(0-p.a)*.18}}
      else{p.x+=p.vx;p.y+=p.vy;p.vy+=.012;p.vx*=1.006;p.a*=.955}
      if(p.a>.02){canli++;ctx.globalAlpha=Math.min(p.a,.95);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}}
    ctx.globalAlpha=1;
    if(hedefBit&&P.length&&now-P[0].t0>300){hedefBit();hedefBit=null}
    if(!P.length&&hedefBit){hedefBit();hedefBit=null}
    if(!canli&&P.length)P=[];}
  return{boyut,fuzyon,dagil,kur,dongu}})();

let sonKare=0;
function kare(t){Gok.ciz(t);Toz.dongu();requestAnimationFrame(kare)}
function boyutla(){Gok.boyut();Toz.boyut()}
boyutla();requestAnimationFrame(kare);

/* ══════════ ÇARK ══════════ */
let aktif=0;
const dk=s=>{const p=String(s).trim().split(':');return +p[0]*60+ +p[1]};
function bul(){
  const b=bgun(),n=new Date(),su=n.getHours()*60+n.getMinutes();
  const bg2=GOREVLER.filter(g=>g.d===b);
  if(bg2.length){
    for(const g of bg2){const p=g.t.split('–');
      if(p.length===2&&su>=dk(p[0])&&su<dk(p[1])&&!D.bitti[id(g)])return GOREVLER.indexOf(g)}
    const i=GOREVLER.findIndex(g=>g.d===b&&!D.bitti[id(g)]);
    if(i>=0)return i;
  }
  let i=GOREVLER.findIndex(g=>!D.bitti[id(g)]&&g.d>=b);
  if(i<0)i=GOREVLER.findIndex(g=>!D.bitti[id(g)]);
  return i<0?GOREVLER.length-1:i;
}
function suAnMi(g){const b=bgun();if(g.d!==b)return false;
  const n=new Date(),su=n.getHours()*60+n.getMinutes(),p=g.t.split('–');
  return p.length===2&&su>=dk(p[0])&&su<dk(p[1])}
const kart=(g,i)=>'<div class="kart"><div class="kUst"><div class="kSaat m">'+g.t.replace('–',' – ')+'</div>'+
  '<div class="kBlok'+(suAnMi(g)?' simdi':'')+'">'+(suAnMi(g)?'ŞU AN':(g.act==='deneme'?'Sınav simülasyonu':'Blok '+g.b))+'</div></div>'+
  '<div class="kBrans"><span class="pt" style="background:'+RENK[g.tag]+'"></span><span>'+esc(g.br)+'</span></div>'+
  '<div class="kKonu">'+esc(g.k)+'</div><div class="kKaynak m">'+esc(g.src)+'</div>'+
  '<div class="kBtn"><button class="bt pri" data-a="b">'+(D.bitti[id(g)]?'Geri al':'Tamamlandı')+'</button>'+
  '<button class="bt" data-a="s">Sonraki</button>'+(i>0?'<button class="bt gh" data-a="o">Önceki</button>':'')+'</div></div>';
function carkCiz(){
  const s=document.getElementById('sahne');
  const a=Math.max(0,aktif-7),z=Math.min(GOREVLER.length-1,aktif+11);
  s.innerHTML='';
  for(let i=a;i<=z;i++){const g=GOREVLER[i],el=document.createElement('div');
    el.className='sr-item'+(i===aktif?' act':'')+(D.bitti[id(g)]?' done':'');el.dataset.i=i;
    el.innerHTML=i===aktif?kart(g,i):
      '<div class="serit"><span class="pt" style="background:'+RENK[g.tag]+'"></span>'+
      '<span class="sa m">'+g.t.split('–')[0]+'</span><span class="br">'+esc(g.br)+'</span>'+
      '<span class="ko">'+esc(g.k)+'</span>'+(D.bitti[id(g)]?'<span class="tik">✓</span>':'')+'</div>';
    if(i!==aktif)el.onclick=()=>gecis(i);
    s.appendChild(el)}
  requestAnimationFrame(diz)}
function diz(){
  const c=[...document.getElementById('sahne').children];
  const a=c.findIndex(x=>+x.dataset.i===aktif);if(a<0)return;
  const kw=document.getElementById('cark').getBoundingClientRect();
  const R=Math.max(340,Math.min(980,kw.height*1.45)),BO=Math.max(6,Math.min(9,kw.height/70));
  const h=c.map(x=>{x.style.marginTop='';return x.getBoundingClientRect().height});
  const th=[];th[a]=0;
  let arc=h[a]/2;
  for(let i=a+1;i<c.length;i++){arc+=BO+h[i]/2;th[i]=arc/R;arc+=h[i]/2}
  arc=-h[a]/2;
  for(let i=a-1;i>=0;i--){arc-=BO+h[i]/2;th[i]=arc/R;arc-=h[i]/2}
  c.forEach((x,i)=>{const t=th[i],ab=Math.abs(t);
    const dx=R*(Math.cos(t)-1),dy=R*Math.sin(t);
    const sc=Math.max(.74,Math.pow(Math.cos(t),.5));
    x.style.marginTop=(-h[i]/2)+'px';
    x.style.transform='translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) rotate('+(t*180/Math.PI).toFixed(2)+'deg) scale('+sc.toFixed(3)+')';
    x.style.opacity=i===a?1:ab>1.10?0:Math.max(0,.97-ab*1.02);
    x.style.pointerEvents=ab>1.10?'none':'auto';
    x.style.zIndex=i===a?9:Math.max(1,8-Math.round(ab*5))});
  rayCiz(R,kw.width,kw.height);
}
function rayCiz(R,W,H){
  const sv=document.getElementById('ray');if(!sv||!W)return;
  const cy=H/2,bx=14;let d='';
  for(let t=-1.16;t<=1.16;t+=.035){
    const x=bx+R*(Math.cos(t)-1),y=cy+R*Math.sin(t);
    d+=(d?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)+' '}
  sv.setAttribute('viewBox','0 0 '+W+' '+H);
  sv.setAttribute('preserveAspectRatio','none');
  sv.innerHTML='<defs><linearGradient id="rg" x1="0" y1="0" x2="0" y2="1">'+
    '<stop offset="0" stop-color="#000"/><stop offset=".18" stop-color="#555"/>'+
    '<stop offset=".5" stop-color="#fff"/><stop offset=".82" stop-color="#555"/>'+
    '<stop offset="1" stop-color="#000"/></linearGradient>'+
    '<mask id="rm"><rect width="'+W+'" height="'+H+'" fill="url(#rg)"/></mask></defs>'+
    '<path d="'+d+'" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="1.1" stroke-linecap="round" mask="url(#rm)"/>'+
    '<circle cx="'+bx+'" cy="'+cy.toFixed(1)+'" r="2.7" fill="rgba(255,255,255,.7)"/>';
}
function gecis(i){aktif=i;carkCiz();brif(GOREVLER[i])}
document.getElementById('sahne').addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const g=GOREVLER[aktif],a=b.dataset.a;
  if(a==='b'){if(D.bitti[id(g)])delete D.bitti[id(g)];
    else{D.bitti[id(g)]=bgun();if(aktif<GOREVLER.length-1){kay();ust();return gecis(aktif+1)}}
    kay();ust();carkCiz()}
  if(a==='s'&&aktif<GOREVLER.length-1)gecis(aktif+1);
  if(a==='o'&&aktif>0)gecis(aktif-1)});

function brif(g){
  const bf=document.getElementById('brifing');bf.classList.remove('gor');
  const bagli=BAGLAR.filter(b=>b[0]===id(g)||b[1]===id(g)).map(b=>{

  bf.innerHTML='<div class="bfEtiket"><i style="background:'+RENK[g.tag]+'"></i><span>'+esc(g.tag)+' · '+esc(g.br)+'</span></div>'+
    '<div id="bfBas">Neden şimdi</div><div id="bfMetin">'+esc(g.why)+'</div>'+
    '<div class="bfKunye">'+
      '<div><span class="cap">Ne yapacaksın</span><span class="d">'+(EYLEM[g.act]||g.act)+'</span></div>'+
      '<div><span class="cap">Süre</span><span class="d m">'+String(g.sure).replace(/\.?0+$/,'')+' sa</span></div>'+
      '<div><span class="cap">Soru / sınav</span><span class="d m">'+(g.soru?g.soru.toFixed(1):'—')+'</span></div>'+
      '<div><span class="cap">Beklenen kazanç</span><span class="d m g">'+(g.kaz>0?'+'+g.kaz.toFixed(2)+' '+(g.tur==='T'?'temel':'klinik')+' net':'—')+'</span></div></div>'+
    (bagli.length?'<div class="bfBag"><div class="h">Bağlandığı konular</div>'+
      bagli.map(x=>'<p><b>'+esc(x.et)+'</b> <span style="color:var(--ink4)">('+x.yon+')</span> — '+esc(x.ni)+'</p>').join('')+'</div>':'');
  if(AZ){bf.classList.add('gor');return}
  requestAnimationFrame(()=>{const bl=[];
    [['bfBas',1.55],['bfMetin',1.25]].forEach(([t,s])=>{const el=document.getElementById(t);if(!el)return;
      const r=el.getBoundingClientRect(),cs=getComputedStyle(el);
      bl.push({metin:el.textContent,renk:cs.color,x:r.left,y:r.top,maxW:r.width+2,
        lh:parseFloat(cs.lineHeight)||parseFloat(cs.fontSize)*1.5,s,
        font:cs.fontWeight+' '+cs.fontSize+' '+cs.fontFamily})});
    Toz.fuzyon(bl,()=>bf.classList.add('gor'))})}

/* ══════════ SEYİR ══════════ */
function rotaHarita(){
  const gn=[...new Set(GOREVLER.map(g=>g.d))].sort(),b=bgun();
  const W=1440,H=190,PL=54,PR=110,y0=H*.56;
  const gx=i=>PL+(W-PL-PR)*i/(gn.length-1);
  const gy=i=>y0+Math.sin(i*.62)*17+Math.sin(i*.21)*11;
  let yol='';gn.forEach((d,i)=>{const x=gx(i),y=gy(i);
    if(!i)yol+='M'+x.toFixed(1)+' '+y.toFixed(1);
    else{const px=gx(i-1),py=gy(i-1),mx=(px+x)/2;
      yol+=' C'+mx.toFixed(1)+' '+py.toFixed(1)+', '+mx.toFixed(1)+' '+y.toFixed(1)+', '+x.toFixed(1)+' '+y.toFixed(1)}});
  let sonBit=-1;gn.forEach((d,i)=>{if(GOREVLER.filter(g=>g.d===d).every(g=>D.bitti[id(g)]))sonBit=i});
  let ele=gn.filter(d=>GOREVLER.filter(g=>g.d===d).every(g=>D.bitti[id(g)])).length;
  const kesX=sonBit>=0?gx(sonBit):PL-6;
  let s='<defs><clipPath id="fetihKlip"><rect x="0" y="0" width="'+kesX.toFixed(1)+'" height="'+H+'"/></clipPath>'+
    '<linearGradient id="toprak" x1="0" y1="0" x2="1" y2="0">'+
    '<stop offset="0" stop-color="#6FA35A" stop-opacity=".02"/><stop offset="1" stop-color="#6FA35A" stop-opacity=".22"/></linearGradient></defs>';
  s+='<path d="'+yol+' L'+(W-PR)+' '+H+' L'+PL+' '+H+' Z" fill="url(#toprak)" clip-path="url(#fetihKlip)"/>';
  s+='<path d="'+yol+'" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="1.2"/>';
  s+='<path d="'+yol+'" fill="none" stroke="#6FA35A" stroke-width="1.8" clip-path="url(#fetihKlip)"/>';
  Object.entries(FAZ).forEach(([f,[a,z]])=>{const i=gn.indexOf(a);if(i<0)return;
